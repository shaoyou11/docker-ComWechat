name: Test and publish GHCR image

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docker_build.yml"
      - "Dockerfile"
      - "VERSION"
      - "run.py"
      - "comwechat_bridge.py"
      - "reliable_queue.py"
      - "healthcheck.py"
      - "dbus_runtime.py"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker_build.yml"
      - "Dockerfile"
      - "VERSION"
      - "run.py"
      - "comwechat_bridge.py"
      - "reliable_queue.py"
      - "healthcheck.py"
      - "dbus_runtime.py"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-comwechat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Compile and test
        run: |
          python -m py_compile run.py comwechat_bridge.py reliable_queue.py healthcheck.py dbus_runtime.py
          python -m unittest discover -s tests -v

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Record build time
        id: metadata
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMWECHAT_IMAGE_REVISION=${{ github.sha }}
            COMWECHAT_IMAGE_BUILD_TIME=${{ steps.metadata.outputs.build_time }}
          tags: |
            ghcr.io/shaoyou11/docker-comwechat:latest
            ghcr.io/shaoyou11/docker-comwechat:${{ steps.version.outputs.value }}
            ghcr.io/shaoyou11/docker-comwechat:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  canary:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Record build time
        id: metadata
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build canary without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            COMWECHAT_IMAGE_REVISION=${{ github.event.pull_request.head.sha }}
            COMWECHAT_IMAGE_BUILD_TIME=${{ steps.metadata.outputs.build_time }}
          tags: ghcr.io/shaoyou11/docker-comwechat:canary
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify private D-Bus startup without WeChat or production data
        run: |
          docker run --rm --network none --entrypoint sh \
            ghcr.io/shaoyou11/docker-comwechat:canary -ec '
              python3 /dbus_runtime.py
              dbus-send --system --print-reply --reply-timeout=2000 --dest=org.freedesktop.DBus / org.freedesktop.DBus.ListNames
              dbus-send --session --print-reply --reply-timeout=2000 --dest=org.freedesktop.DBus / org.freedesktop.DBus.ListNames
              python3 /dbus_runtime.py
              test "$(ps -C dbus-daemon --no-headers | wc -l)" -eq 2
            '
