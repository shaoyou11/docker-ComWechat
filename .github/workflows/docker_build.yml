name: Test and publish GHCR image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker_build.yml"
      - "Dockerfile"
      - "VERSION"
      - "run.py"
      - "comwechat_bridge.py"
      - "reliable_queue.py"
      - "healthcheck.py"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-comwechat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Compile and test
        run: |
          python -m py_compile run.py comwechat_bridge.py healthcheck.py
          python -m unittest discover -s tests -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/shaoyou11/docker-comwechat:latest
            ghcr.io/shaoyou11/docker-comwechat:${{ steps.version.outputs.value }}
            ghcr.io/shaoyou11/docker-comwechat:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
