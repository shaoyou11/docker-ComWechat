name: Documentation check

on:
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/docker_doc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify required documentation
        run: |
          test -s README.md
          grep -q "COMWECHAT_BRIDGE_ENABLED" README.md
          grep -q "回滚" README.md
